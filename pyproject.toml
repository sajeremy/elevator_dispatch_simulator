[project]
name = "elevator-dispatch-simulator"
version = "0.1.0"
description = "Discrete-time simulator for comparing elevator dispatch algorithms"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
